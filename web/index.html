<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tapdeck">
<meta name="theme-color" content="#0b0b10">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<title>Tapdeck</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/phone.css">
</head>
<body>

<div class="shell">
  <header class="bar">
    <div class="clock"><span class="time" id="time">--:--</span><span class="date" id="date"></span></div>
    <div class="chips">
      <div class="chip" id="cpuChip"><i>CPU</i><b>–</b></div>
      <div class="chip" id="ramChip"><i>RAM</i><b>–</b></div>
      <div class="chip" id="batChip"><i data-i18n="battery"></i><b>–</b></div>
    </div>
  </header>

  <main class="pages" id="pages">
    <section class="page" id="musicPage">
      <div class="music">
        <div class="np">
          <div class="art" id="art">
            <img id="artImg" alt="">
            <svg class="ico" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
          </div>
          <div class="np-side">
            <div>
              <div class="source" id="source"><i class="dot"></i><span id="sourceText"></span></div>
              <div class="title" id="title"></div>
              <div class="artist" id="artist"></div>
              <div class="note" id="note" hidden></div>
            </div>
            <div class="progress" id="progress">
              <span id="elapsed">0:00</span>
              <div class="seek" id="seek"><div class="track"><div class="fill"></div></div></div>
              <span id="duration">0:00</span>
            </div>
            <div class="transport">
              <button id="prev" class="press" aria-label="Previous"></button>
              <button id="play" class="play press" aria-label="Play/Pause"></button>
              <button id="next" class="press" aria-label="Next"></button>
            </div>
          </div>
        </div>
        <div class="hslider" id="volumeRow">
          <button class="btn card press" id="mute" aria-label="Mute"></button>
          <div class="pill" id="volume"><div class="fill"></div><div class="lbl" id="volumeVal"></div></div>
        </div>
      </div>
    </section>
    <!-- button pages are added here from /api/deck -->
  </main>

  <nav class="dots" id="dots"></nav>
</div>

<div class="offline" id="offline" data-i18n="offline"></div>
<div class="toast" id="toast"></div>
<div class="gate" id="gate"><div><h1 data-i18n="gateTitle"></h1><p data-i18n="gateText"></p></div></div>

<script src="/js/common.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/nosleep/0.12.0/NoSleep.min.js"></script>
<script src="/js/phone.js"></script>
</body>
</html>
