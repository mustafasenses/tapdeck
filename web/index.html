<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tapdeck">
<meta name="theme-color" content="#0b0b10">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<title>Tapdeck</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/phone.css">
</head>
<body>

<div class="ambient" id="ambient" aria-hidden="true"></div>
<div class="screen" id="screen">
<div class="shell">
  <header class="bar">
    <div class="clock"><span class="time" id="time">--:--</span><span class="date" id="date"></span></div>
    <div class="chips">
      <div class="chip" id="cpuChip"><i>CPU</i><b>–</b></div>
      <div class="chip" id="ramChip"><i>RAM</i><b>–</b></div>
      <div class="chip" id="batChip"><i data-i18n="battery"></i><b>–</b></div>
    </div>
  </header>

  <main class="pages" id="pages">
    <!-- pages of buttons and widgets come from /api/deck -->
  </main>

  <nav class="dots" id="dots"></nav>
</div>

<div class="offline" id="offline" data-i18n="offline"></div>
<div class="toast" id="toast"></div>
<div class="gate" id="gate"><div><h1 data-i18n="gateTitle"></h1><p data-i18n="gateText"></p></div></div>
</div>

<script src="/js/common.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/nosleep/0.12.0/NoSleep.min.js"></script>
<script src="/js/phone.js"></script>
</body>
</html>
